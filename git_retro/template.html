<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E11">
<title>git retro</title>
<style>
/* Formato: stories (9:16) com um slide por estatística, cada um com a sua cor.
   Fontes embutidas (Bricolage Grotesque e JetBrains Mono, OFL): a página abre offline, igual em qualquer sistema. */
@font-face{font-family:"Retro";font-weight:800;font-display:block;src:url(data:font/woff2;base64,/*FONT:display-800*/) format("woff2")}
@font-face{font-family:"Retro";font-weight:500;font-display:block;src:url(data:font/woff2;base64,/*FONT:text-500*/) format("woff2")}
@font-face{font-family:"RetroMono";font-weight:600;font-display:block;src:url(data:font/woff2;base64,/*FONT:mono-600*/) format("woff2")}
:root{
  --ink:#0E0E11;--paper:#F4F0E6;--lime:#C6FF3D;--violet:#6C4CF5;--orange:#FF5A1F;--blue:#1E3BFF;--pink:#FF8AD0;
  --sans:"Retro",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"RetroMono",ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--paper);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
body{display:grid;place-items:center;user-select:none;-webkit-user-select:none}
.stage{position:relative;width:min(100vw,calc(100dvh * 9 / 16));height:min(100dvh,calc(100vw * 16 / 9));overflow:hidden;
  container-type:size;background:var(--ink)}
@media (min-width:700px){.stage{height:min(92dvh,900px);width:calc(min(92dvh,900px) * 9 / 16);border-radius:22px;box-shadow:0 30px 120px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06)}}
.help{position:fixed;bottom:18px;left:50%;translate:-50% 0;font:500 12px/1 var(--mono);color:rgba(244,240,230,.4);letter-spacing:.04em}
@media (max-width:699px){.help{display:none}}

.bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:20}
.bars i{flex:1;height:3px;border-radius:2px;background:color-mix(in srgb,var(--fg) 25%,transparent);overflow:hidden}
.bars i b{display:block;height:100%;width:100%;background:var(--fg);transform:scaleX(0);transform-origin:left}
.bars i.done b{transform:scaleX(1)}
.top{position:absolute;top:24px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:20;
  font:600 3.1cqw/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
.top button{all:unset;cursor:pointer;padding:6px 8px;margin:-6px -8px;font:inherit}

.slide{position:absolute;inset:0;padding:19cqw 7cqw 10cqw;display:flex;flex-direction:column;justify-content:center;gap:3cqw;
  background:var(--bg);color:var(--fg);opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
.slide.on{opacity:1;visibility:visible;transition:opacity .35s}
.th-ink{--bg:var(--ink);--fg:var(--paper);--ac:var(--lime)}
.th-lime{--bg:var(--lime);--fg:var(--ink);--ac:var(--ink)}
.th-violet{--bg:var(--violet);--fg:#fff;--ac:var(--lime)}
.th-orange{--bg:var(--orange);--fg:#fff;--ac:var(--ink)}
.th-blue{--bg:var(--blue);--fg:#fff;--ac:var(--lime)}
.th-pink{--bg:var(--pink);--fg:var(--ink);--ac:var(--ink)}
.th-paper{--bg:var(--paper);--fg:var(--ink);--ac:var(--orange)}
.stage{--fg:var(--paper)}

.k{font:600 3.3cqw/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.h{font-weight:800;font-size:9.5cqw;line-height:.95;letter-spacing:-.035em}
.huge{font-weight:800;font-size:27cqw;line-height:.82;letter-spacing:-.06em;color:var(--ac);font-variant-numeric:tabular-nums}
.big{font-weight:800;font-size:16cqw;line-height:.86;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.p{font-size:4.6cqw;line-height:1.35;font-weight:500;max-width:34ch}
.p b{font-weight:800}
.cmp{display:grid;gap:3.2cqw}
.cmp .r{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:0 3cqw;border-top:1px solid color-mix(in srgb,var(--fg) 25%,transparent);padding-top:2.6cqw}
.cmp .l{font:600 3.1cqw/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;opacity:.8;grid-column:1/-1}
.cmp .v{font-weight:800;font-size:10cqw;letter-spacing:-.04em;line-height:1}
.cmp .d{font-weight:800;font-size:5.4cqw;padding:1.2cqw 2.6cqw;border-radius:99px;background:var(--fg);color:var(--bg)}
.cmp .d.dn{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg)}
.q{font-weight:800;font-size:6.4cqw;line-height:1.12;letter-spacing:-.02em}
.q::before{content:"“"}.q::after{content:"”"}
.meta{font:500 3.4cqw/1.3 var(--mono);opacity:.7}
.sp{flex:1}

/* entrada: cada .rv sobe quando o slide liga */
.rv{opacity:0;translate:0 7cqw}
.on .rv{animation:rv .9s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes rv{from{opacity:0;translate:0 7cqw}to{opacity:1;translate:0 0}}
.chars .cw{display:inline-block;white-space:nowrap}
.chars i{display:inline-block;font-style:normal;opacity:0;translate:0 60%;rotate:8deg}
.on .chars i{animation:ch .8s var(--ease) both;animation-delay:calc(var(--d,0s) + var(--i) * 60ms)}
@keyframes ch{to{opacity:1;translate:0 0;rotate:0deg}}
.pop{transform:scale(.4);opacity:0}
.on .pop{animation:pop .7s cubic-bezier(.34,1.56,.64,1) both;animation-delay:var(--d,0s)}
@keyframes pop{to{transform:scale(1);opacity:1}}

/* gráficos */
.cal{width:100%;height:auto;display:block}
.cal rect{opacity:0}
.on .cal rect{animation:cell .5s var(--ease) both;animation-delay:calc(.3s + var(--w) * 18ms)}
@keyframes cell{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
.cal rect{transform-box:fill-box;transform-origin:center}
.cal text{font:600 9px var(--mono);fill:currentColor;opacity:.6}
.clock{width:84%;align-self:center;height:auto;overflow:visible}
.clock line.b{stroke-dasharray:1;stroke-dashoffset:1}
.on .clock line.b{transition:stroke-dashoffset 1s var(--ease);transition-delay:calc(.3s + var(--i) * 35ms);stroke-dashoffset:0}
.clock text{font:700 11px var(--mono);fill:currentColor;text-anchor:middle;dominant-baseline:middle;opacity:.7}
.hb{display:grid;gap:2.6cqw}
.hb .r{display:grid;grid-template-columns:1fr auto;gap:1cqw 3cqw;align-items:end}
.hb .n{font-weight:800;font-size:5cqw;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .v{font:600 3.6cqw var(--mono);opacity:.8}
.hb .t{grid-column:1/-1;height:2.6cqw;border-radius:2cqw;background:color-mix(in srgb,var(--fg) 14%,transparent);overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--ac));width:var(--w);transform:scaleX(0);transform-origin:left}
.on .hb .t i{transition:transform 1.2s var(--ease);transition-delay:var(--d,0s);transform:scaleX(1)}
.words{display:flex;flex-wrap:wrap;gap:1.6cqw 3cqw;align-items:baseline}
.words span{font-weight:800;letter-spacing:-.03em;line-height:1}
.pm{display:flex;gap:4cqw;align-items:baseline;flex-wrap:wrap}
.pm .big:last-child{opacity:.55}
.weeks{display:flex;gap:1.4cqw;align-items:flex-end;height:22cqw}
.weeks div{flex:1;display:flex;flex-direction:column;align-items:center;gap:1.4cqw;height:100%;justify-content:flex-end}
.weeks i{display:block;width:100%;border-radius:1.4cqw;background:var(--ac);height:var(--h);transform:scaleY(0);transform-origin:bottom}
.on .weeks i{transition:transform 1s var(--ease);transition-delay:calc(.3s + var(--i) * 60ms);transform:scaleY(1)}
.weeks span{font:600 2.8cqw var(--mono);opacity:.7}
.ico{display:block;width:32cqw;height:32cqw;overflow:visible}
.ico.sm{display:inline-block;width:5.2cqw;height:5.2cqw;vertical-align:-.9cqw;margin-right:1cqw}
.hint{font:500 3cqw/1.4 var(--mono);opacity:.6}

.summary{gap:2.4cqw;padding-top:17cqw}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
.grid div{border:1px solid color-mix(in srgb,var(--fg) 18%,transparent);border-radius:3cqw;padding:3.2cqw}
.grid b{display:block;font-weight:800;font-size:min(8.4cqw,var(--fs,8.4cqw));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.04em;color:var(--ac);line-height:1}
.grid span{font:600 2.9cqw/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.acts{display:flex;gap:2.4cqw;position:relative;z-index:30}
.btn{all:unset;cursor:pointer;flex:1;text-align:center;padding:3.6cqw;border-radius:99px;font-weight:800;font-size:4cqw;background:var(--ac);color:var(--bg)}
.btn.g{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--fg) 35%,transparent)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.tap{position:absolute;inset:0;z-index:10;display:grid;grid-template-columns:30% 70%}
.tap i{cursor:pointer}
.mv{position:fixed;inset:0;z-index:100;display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;padding:16px;
  background:rgba(14,14,17,.94);--ac:var(--lime);--bg:var(--ink);--fg:var(--paper);color:var(--paper);overflow:auto}
.mv[hidden]{display:none}
.mv canvas{height:min(74dvh,760px);width:auto;aspect-ratio:9/16;border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 90px rgba(0,0,0,.6);background:var(--ink)}
.mv-side{width:min(320px,100%);display:grid;gap:14px}
.mv-side b{font-weight:800;font-size:26px;letter-spacing:-.02em}
.mv-side p{font:500 13px/1.5 var(--mono);opacity:.7;min-height:1.5em}
.mv-bar{height:4px;border-radius:2px;background:rgba(244,240,230,.15);overflow:hidden}
.mv-bar i{display:block;height:100%;background:var(--lime);transform:scaleX(0);transform-origin:left}
.mv-acts{display:grid;gap:10px}
.mv .btn{font-size:16px;padding:15px 18px}
@media (max-width:699px){.mv{flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;gap:16px}.mv canvas{height:58dvh}.mv-side{width:100%}}
.foot{position:absolute;bottom:4cqw;left:7cqw;right:7cqw;font:500 2.8cqw var(--mono);opacity:.5;z-index:20;color:var(--fg)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>

</div>
<p class="help" id="help"></p>
<div class="mv" id="mv" hidden role="dialog" aria-modal="true" aria-labelledby="mvt">

  <div class="mv-side"><b id="mvt"></b><div class="mv-bar"><i id="mvp"></i></div><p id="mvs"></p><div class="mv-acts" id="mva"></div></div>

const T = {

/* ---------- gráficos ---------- */
function calendar() {
  const y = D.year, start = new Date(y, 0, 1), max = Math.max(1, ...Object.values(D.days));
  const off = (start.getDay() + 6) % 7; // semana começa na segunda
  const half = 27, cs = 11, g = 2, top = 14;
  let out = '', w = 0;
  for (let d = new Date(start); d.getFullYear() === y; d.setDate(d.getDate() + 1)) {
    const doy = Math.round((d - start) / 864e5), wk = Math.floor((doy + off) / 7), row = (d.getDay() + 6) % 7;
    const part = wk < half ? 0 : 1, col = wk - part * half;
    const iso = `${y}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const n = D.days[iso] || 0, lv = n ? Math.ceil(Math.min(1, n / (max * .6)) * 4) : 0;
    const op = [0.09, .35, .55, .78, 1][lv];
    out += `<rect x="${col * (cs + g)}" y="${top + part * (7 * (cs + g) + top + 6) + row * (cs + g)}" width="${cs}" height="${cs}" rx="2.5" fill="${lv ? 'var(--ac)' : 'currentColor'}" fill-opacity="${op}" style="--w:${wk}"><title>${iso}: ${n}</title></rect>`;
    w = Math.max(w, col);
  }
  const mn = i => new Date(y, i, 1).toLocaleDateString(L === 'pt' ? 'pt-BR' : 'en-US', { month: 'short' }).replace('.', '');
  const H = 2 * (7 * (cs + g) + top) + 6;
  return `<svg class="cal" viewBox="0 0 ${(w + 1) * (cs + g)} ${H}" role="img" aria-label="${esc(T.yearbyday)}">
    <text x="0" y="9">${mn(0)} – ${mn(5)}</text><text x="0" y="${7 * (cs + g) + top + 6 + 9}">${mn(6)} – ${mn(11)}</text>${out}</svg>`;
}
function clock() {
  const max = Math.max(1, ...D.hours), R0 = 46, R1 = 128;
  let s = '';
  D.hours.forEach((n, h) => {
    const a = (h / 24) * Math.PI * 2 - Math.PI / 2, r = R0 + (R1 - R0) * (n / max), c = Math.cos(a), si = Math.sin(a);
    s += `<line x1="${150 + c * R0}" y1="${150 + si * R0}" x2="${150 + c * R1}" y2="${150 + si * R1}" stroke="currentColor" stroke-opacity=".12" stroke-width="7" stroke-linecap="round"/>`;
    if (n) s += `<line class="b" pathLength="1" style="--i:${h}" x1="${150 + c * R0}" y1="${150 + si * R0}" x2="${150 + c * r}" y2="${150 + si * r}" stroke="var(--ac)" stroke-width="7" stroke-linecap="round"/>`;
  });
  [0, 6, 12, 18].forEach(h => { const a = (h / 24) * Math.PI * 2 - Math.PI / 2; s += `<text x="${150 + Math.cos(a) * 146}" y="${150 + Math.sin(a) * 146}">${h}h</text>`; });
  return `<svg class="clock" viewBox="0 0 300 300" role="img" aria-label="${esc(T.clock)}">${s}</svg>`;
}
const hbars = (rows, val, label, color) => {
  const max = Math.max(1, ...rows.map(val));
  return `<div class="hb">${rows.map((r, i) => `<div class="r rv" style="--d:${.25 + i * .1}s"><span class="n">${esc(label(r))}</span><span class="v">${nf(val(r))}</span>

/* ---------- motor dos stories ---------- */
const box = $('#slides'), bars = $('#bars');
box.innerHTML = S.map((s, i) => `<section class="slide th-${s.th} ${s.cls || ''}" data-i="${i}" aria-hidden="true">${s.html}</section>`).join('');
bars.innerHTML = S.map(() => '<i><b></b></i>').join('');
$('#yr').textContent = D.year; $('#help').textContent = T.help;
const slides = [...box.children], segs = [...bars.children];
const DUR = 6500, RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur = -1, t0 = 0, elapsed = 0, paused = false, held = false, raf = 0;

function countUps(el) {
  el.querySelectorAll('[data-count]').forEach(c => {
    const to = +c.dataset.count, st = performance.now(), d = RM ? 1 : 1600;
    const step = now => { const k = Math.min(1, (now - st) / d), e = 1 - Math.pow(1 - k, 4); c.textContent = nf(to * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function go(i) {
  i = Math.max(0, Math.min(S.length - 1, i));
  if (i === cur) return;
  slides.forEach((s, k) => { s.classList.remove('on'); s.setAttribute('aria-hidden', 'true'); });
  const s = slides[i]; void s.offsetWidth; s.classList.add('on'); s.setAttribute('aria-hidden', 'false');
  $('#stage').className = 'stage th-' + S[i].th;
  segs.forEach((g, k) => { g.classList.toggle('done', k < i); g.firstChild.style.transform = k < i ? 'scaleX(1)' : 'scaleX(0)'; });
  $('#tap').style.display = S[i].last ? 'none' : '';
  cur = i; elapsed = 0; t0 = performance.now(); countUps(s);
  if (S[i].last) setTimeout(() => prepare().catch(() => {}), 800);
}
function loop(now) {
  if (!paused && !held && !S[cur].last && !document.hidden) {
    elapsed += now - t0;
    segs[cur].firstChild.style.transform = `scaleX(${Math.min(1, elapsed / DUR)})`;
    if (elapsed >= DUR) go(cur + 1);
  }
  t0 = now; raf = requestAnimationFrame(loop);
}
const setPause = p => { paused = p; $('#pause').textContent = p ? '▶' : '❚❚'; $('#pause').setAttribute('aria-label', p ? 'play' : 'pause'); };
$('#pause').addEventListener('click', e => { e.stopPropagation(); setPause(!paused); });
let downAt = 0;
$('#tap').addEventListener('pointerdown', () => { downAt = performance.now(); held = true; });
$('#tap').addEventListener('pointerup', e => { held = false; if (performance.now() - downAt < 250) go(cur + +e.target.dataset.dir); });
$('#tap').addEventListener('pointercancel', () => { held = false; });
$('#tap').addEventListener('pointerleave', () => { held = false; });
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1);
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
  else if (e.key === ' ') { e.preventDefault(); setPause(!paused); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(S.length - 1);
});
let sx = 0;
$('#stage').addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
$('#stage').addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60) go(cur + (dx < 0 ? 1 : -1)); }, { passive: true });
$('#again').addEventListener('click', () => { cur = -1; go(0); });
$('#mvbtn').addEventListener('click', () => openMotion());

const eo = t => 1 - Math.pow(1 - clamp(t), 4);

const eio = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };

const fit = (txt, w, px, maxW, f = SANS) => { let s = px; font(w, s, f); while (c.measureText(txt).width > maxW && s > 16) { s -= 2; font(w, s, f); } return s; };
const track = px => { try { c.letterSpacing = px + 'px'; } catch (e) {} };
const rr = (x, y, w, h, r) => { c.beginPath(); c.roundRect(x, y, w, h, r); };
const enter = (p, dy, fn) => { if (p <= 0) return; c.save(); c.globalAlpha *= clamp(p); c.translate(0, (1 - eo(p)) * dy); fn(); c.restore(); };
function wrap(txt, x, y, maxW, lh) {
  let line = '';
  for (const w of String(txt).split(' ')) { const t = line ? line + ' ' + w : w; if (c.measureText(t).width > maxW && line) { c.fillText(line, x, y); y += lh; line = w; } else line = t; }
  if (line) c.fillText(line, x, y);
  return y;
}

// células do calendário, calculadas uma vez
const CAL = (() => {
  const y = D.year, start = new Date(y, 0, 1), off = (start.getDay() + 6) % 7, max = Math.max(1, ...Object.values(D.days)), out = [];

    const iso = `${y}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`, n = D.days[iso] || 0;
    out.push({ wk, row, part: wk < 27 ? 0 : 1, col: wk < 27 ? wk : wk - 27, lv: n ? Math.ceil(Math.min(1, n / (max * .6)) * 4) : 0 });
  }

const mshort = i => new Date(D.year, i, 1).toLocaleDateString(L === 'pt' ? 'pt-BR' : 'en-US', { month: 'short' }).replace('.', '').toUpperCase();

/* ---------- MP4 de verdade: H.264 pelo WebCodecs e um muxer mínimo (moov no início, sem fragmentos) ---------- */
const FPS = 30;
function mp4Mux(samples, avcC, w, h) {
  const u32 = n => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255], u16 = n => [(n >> 8) & 255, n & 255];

  const full = (type, v, flags, ...parts) => box(type, [v, (flags >> 16) & 255, (flags >> 8) & 255, flags & 255], ...parts);
  const matrix = [0x00010000, 0, 0, 0, 0x00010000, 0, 0, 0, 0x40000000].map(u32);
  const n = samples.length, TS = FPS * 1000, durTS = n * 1000, durMs = Math.round(n * 1000 / FPS);
  const moov = off => box('moov',
    full('mvhd', 0, 0, u32(0), u32(0), u32(1000), u32(durMs), u32(0x00010000), u16(0x0100), Array(10).fill(0), matrix, Array(24).fill(0), u32(2)),
    box('trak',
      full('tkhd', 0, 3, u32(0), u32(0), u32(1), u32(0), u32(durMs), Array(8).fill(0), u16(0), u16(0), u16(0), u16(0), matrix, u32(w << 16), u32(h << 16)),
      box('mdia',
        full('mdhd', 0, 0, u32(0), u32(0), u32(TS), u32(durTS), u16(0x55C4), u16(0)),
        full('hdlr', 0, 0, u32(0), str('vide'), Array(12).fill(0), str('VideoHandler'), 0),
        box('minf',
          full('vmhd', 0, 1, Array(8).fill(0)),
          box('dinf', full('dref', 0, 0, u32(1), full('url ', 0, 1))),
          box('stbl',
            full('stsd', 0, 0, u32(1), box('avc1', Array(6).fill(0), u16(1), Array(16).fill(0), u16(w), u16(h), u32(0x00480000), u32(0x00480000), u32(0), u16(1), Array(32).fill(0), u16(0x18), u16(0xFFFF), box('avcC', [...avcC]))),
            full('stts', 0, 0, u32(1), u32(n), u32(1000)),
            full('stss', 0, 0, u32(samples.filter(s => s.key).length), samples.map((s, i) => s.key ? u32(i + 1) : []).flat()),
            full('stsc', 0, 0, u32(1), u32(1), u32(n), u32(1)),
            full('stsz', 0, 0, u32(0), u32(n), samples.map(s => u32(s.data.length)).flat()),
            full('stco', 0, 0, u32(1), u32(off)))))));

  const head = new Uint8Array([...ftyp, ...moov(ftyp.length + moovLen + 8), ...u32(8 + dataLen), ...str('mdat')]);
  const out = new Uint8Array(head.length + dataLen); out.set(head);
  let o = head.length; for (const s of samples) { out.set(s.data, o); o += s.data.length; }
  return out;
}
async function encodeMp4(cv, onProgress) {
  if (!window.VideoEncoder || !window.VideoFrame) return null;
  const cfg = { codec: 'avc1.640028', width: VW, height: VH, bitrate: 9e6, framerate: FPS, avc: { format: 'avc' } };
  for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42e028']) {
    cfg.codec = codec;
    try { if ((await VideoEncoder.isConfigSupported(cfg)).supported) break; } catch (e) {}
    if (codec === 'avc1.42e028') return null;
  }
  const samples = []; let avcC = null, err = null, lastTs = -1, reordered = false;
  const enc = new VideoEncoder({
    output: (chunk, meta) => {
      if (meta && meta.decoderConfig && meta.decoderConfig.description) avcC = new Uint8Array(meta.decoderConfig.description);
      if (chunk.timestamp < lastTs) reordered = true; lastTs = chunk.timestamp;
      const data = new Uint8Array(chunk.byteLength); chunk.copyTo(data); samples.push({ data, key: chunk.type === 'key' });
    },
    error: e => { err = e; },
  });
  enc.configure(cfg);
  const ctx = cv.getContext('2d'), N = Math.ceil((TOTAL + .6) * FPS);
  for (let k = 0; k < N; k++) {
    if (err || !recording) break;
    frame(ctx, Math.min(k / FPS, TOTAL));
    const vf = new VideoFrame(cv, { timestamp: Math.round(k * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
    enc.encode(vf, { keyFrame: k % (FPS * 2) === 0 }); vf.close();
    onProgress((k + 1) / N);
    if (enc.encodeQueueSize > 6 || k % 6 === 0) await new Promise(r => setTimeout(r, 0));
  }
  await enc.flush(); enc.close();
  if (err || !recording || !avcC || reordered || samples.length < N) return null;
  return new File([mp4Mux(samples, avcC, VW, VH)], `git-retro-${D.year}.mp4`, { type: 'video/mp4' });
}

/* ---------- janela do vídeo ---------- */
let mvLoop = 0, videoFile = null, recording = false;
function mvButtons(list) {
  const box = $('#mva'); box.innerHTML = '';
  list.forEach(([label, fn, ghost]) => { const b = document.createElement('button'); b.className = 'btn' + (ghost ? ' g' : ''); b.textContent = label; b.onclick = fn; box.append(b); });
}
function preview(cv) {
  const ctx = cv.getContext('2d'), st = performance.now();
  cancelAnimationFrame(mvLoop);
  const step = now => { frame(ctx, ((now - st) / 1000) % (TOTAL + 1.2)); mvLoop = requestAnimationFrame(step); };
  mvLoop = requestAnimationFrame(step);
}
function finished(note) {
  $('#mvt').textContent = T.ready; $('#mvp').style.transform = 'scaleX(1)'; $('#mvs').textContent = note || T.musicTip;
  const acts = [];
  if (videoFile && canShareFile(videoFile)) acts.push([T.postVideo, () => shareFile(videoFile)]);
  if (videoFile) acts.push([T.downloadVideo, () => saveFile(videoFile), acts.length > 0]);
  acts.push([T.download, async () => { const f = await makeCard(); canShareFile(f) && matchMedia('(pointer:coarse)').matches ? shareFile(f) : saveFile(f); }, true]);
  acts.push([T.close, closeMotion, true]);
  mvButtons(acts);
}
async function openMotion() {
  held = true; $('#mv').hidden = false; document.body.style.overflow = 'hidden';
  const cv = $('#mvc');
  if (videoFile) { preview(cv); finished(); return; }
  $('#mvt').textContent = T.recording; $('#mvs').textContent = T.keepOpen; $('#mvp').style.transform = 'scaleX(0)';
  mvButtons([[T.close, closeMotion, true]]);
  await prepare();
  recording = true;
  const mp4 = await encodeMp4(cv, k => { $('#mvp').style.transform = `scaleX(${k})`; }).catch(() => null);
  if (!recording) return;
  if (mp4) { recording = false; videoFile = mp4; preview(cv); finished(); return; }
  // sem WebCodecs: grava em tempo real com o MediaRecorder
  const types = ['video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1.42E01F', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const mime = window.MediaRecorder && cv.captureStream ? types.find(t => MediaRecorder.isTypeSupported(t)) : null;
  if (!mime) { preview(cv); finished(T.noVideo); return; }
  const ctx = cv.getContext('2d'), stream = cv.captureStream(30);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6 }), chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise(r => { rec.onstop = r; });
  recording = true; frame(ctx, 0); rec.start(250);
  const st = performance.now();
  await new Promise(res => {
    const step = now => {
      if (!recording) return res();
      const t = (now - st) / 1000; frame(ctx, Math.min(t, TOTAL));
      $('#mvp').style.transform = `scaleX(${clamp(t / (TOTAL + .4))})`;
      if (t < TOTAL + .4) mvLoop = requestAnimationFrame(step); else res();
    };
    mvLoop = requestAnimationFrame(step);
  });
  const cancelled = !recording; recording = false;
  rec.stop(); await stopped; stream.getTracks().forEach(t => t.stop());
  if (cancelled) return;
  const type = mime.split(';')[0], ext = type === 'video/mp4' ? 'mp4' : 'webm';
  videoFile = new File([new Blob(chunks, { type })], `git-retro-${D.year}.${ext}`, { type });
  preview(cv);
  finished(ext === 'webm' ? T.webmNote : '');
}
function closeMotion() {
  recording = false; cancelAnimationFrame(mvLoop); $('#mv').hidden = true; document.body.style.overflow = ''; held = false;
}
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#mv').hidden) closeMotion(); });
