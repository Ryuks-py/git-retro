:root{
  --ink:#0E0E11;--paper:#F4F0E6;--lime:#C6FF3D;--violet:#6C4CF5;--orange:#FF5A1F;--blue:#1E3BFF;--pink:#FF8AD0;
  --sans:"Retro",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"RetroMono",ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--paper);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
body{display:grid;place-items:center;user-select:none;-webkit-user-select:none}
.stage{position:relative;width:min(100vw,calc(100dvh * 9 / 16));height:min(100dvh,calc(100vw * 16 / 9));overflow:hidden;
  container-type:size;background:var(--ink)}
@media (min-width:700px){.stage{height:min(92dvh,900px);width:calc(min(92dvh,900px) * 9 / 16);border-radius:22px;box-shadow:0 30px 120px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06)}}
.help{position:fixed;bottom:18px;left:50%;translate:-50% 0;font:500 12px/1 var(--mono);color:rgba(244,240,230,.4);letter-spacing:.04em}
@media (max-width:699px){.help{display:none}}

.bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:20}
.bars i{flex:1;height:3px;border-radius:2px;background:color-mix(in srgb,var(--fg) 25%,transparent);overflow:hidden}
.bars i b{display:block;height:100%;width:100%;background:var(--fg);transform:scaleX(0);transform-origin:left}
.bars i.done b{transform:scaleX(1)}
.top{position:absolute;top:24px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:20;
  font:600 3.1cqw/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
.top button{all:unset;cursor:pointer;padding:6px 8px;margin:-6px -8px;font:inherit}

.slide{position:absolute;inset:0;padding:19cqw 7cqw 10cqw;display:flex;flex-direction:column;justify-content:center;gap:3cqw;
  background:var(--bg);color:var(--fg);opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
.slide.on{opacity:1;visibility:visible;transition:opacity .35s}
.th-ink{--bg:var(--ink);--fg:var(--paper);--ac:var(--lime)}
.th-lime{--bg:var(--lime);--fg:var(--ink);--ac:var(--ink)}
.th-violet{--bg:var(--violet);--fg:#fff;--ac:var(--lime)}
.th-orange{--bg:var(--orange);--fg:#fff;--ac:var(--ink)}
.th-blue{--bg:var(--blue);--fg:#fff;--ac:var(--lime)}
.th-pink{--bg:var(--pink);--fg:var(--ink);--ac:var(--ink)}
.th-paper{--bg:var(--paper);--fg:var(--ink);--ac:var(--orange)}
.stage{--fg:var(--paper)}

.k{font:600 3.3cqw/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.h{font-weight:800;font-size:9.5cqw;line-height:.95;letter-spacing:-.035em}
.huge{font-weight:800;font-size:27cqw;line-height:.82;letter-spacing:-.06em;color:var(--ac);font-variant-numeric:tabular-nums}
.big{font-weight:800;font-size:16cqw;line-height:.86;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.p{font-size:4.6cqw;line-height:1.35;font-weight:500;max-width:34ch}
.p b{font-weight:800}
.cmp{display:grid;gap:3.2cqw}
.cmp .r{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:0 3cqw;border-top:1px solid color-mix(in srgb,var(--fg) 25%,transparent);padding-top:2.6cqw}
.cmp .l{font:600 3.1cqw/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;opacity:.8;grid-column:1/-1}
.cmp .v{font-weight:800;font-size:10cqw;letter-spacing:-.04em;line-height:1}
.cmp .d{font-weight:800;font-size:5.4cqw;padding:1.2cqw 2.6cqw;border-radius:99px;background:var(--fg);color:var(--bg)}
.cmp .d.dn{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg)}
.q{font-weight:800;font-size:6.4cqw;line-height:1.12;letter-spacing:-.02em}
.q::before{content:"“"}.q::after{content:"”"}
.meta{font:500 3.4cqw/1.3 var(--mono);opacity:.7}
.sp{flex:1}

/* entrada: cada .rv sobe quando o slide liga */
.rv{opacity:0;translate:0 7cqw}
.on .rv{animation:rv .9s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes rv{from{opacity:0;translate:0 7cqw}to{opacity:1;translate:0 0}}
.chars .cw{display:inline-block;white-space:nowrap}
.chars i{display:inline-block;font-style:normal;opacity:0;translate:0 60%;rotate:8deg}
.on .chars i{animation:ch .8s var(--ease) both;animation-delay:calc(var(--d,0s) + var(--i) * 60ms)}
@keyframes ch{to{opacity:1;translate:0 0;rotate:0deg}}
.pop{transform:scale(.4);opacity:0}
.on .pop{animation:pop .7s cubic-bezier(.34,1.56,.64,1) both;animation-delay:var(--d,0s)}
@keyframes pop{to{transform:scale(1);opacity:1}}

/* gráficos */
.cal{width:100%;height:auto;display:block}
.cal rect{opacity:0}
.on .cal rect{animation:cell .5s var(--ease) both;animation-delay:calc(.3s + var(--w) * 18ms)}
@keyframes cell{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
.cal rect{transform-box:fill-box;transform-origin:center}
.cal text{font:600 9px var(--mono);fill:currentColor;opacity:.6}
.clock{width:84%;align-self:center;height:auto;overflow:visible}
.clock line.b{stroke-dasharray:1;stroke-dashoffset:1}
.on .clock line.b{transition:stroke-dashoffset 1s var(--ease);transition-delay:calc(.3s + var(--i) * 35ms);stroke-dashoffset:0}
.clock text{font:700 11px var(--mono);fill:currentColor;text-anchor:middle;dominant-baseline:middle;opacity:.7}
.hb{display:grid;gap:2.6cqw}
.hb .r{display:grid;grid-template-columns:1fr auto;gap:1cqw 3cqw;align-items:end}
.hb .n{font-weight:800;font-size:5cqw;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .v{font:600 3.6cqw var(--mono);opacity:.8}
.hb .t{grid-column:1/-1;height:2.6cqw;border-radius:2cqw;background:color-mix(in srgb,var(--fg) 14%,transparent);overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--ac));width:var(--w);transform:scaleX(0);transform-origin:left}
.on .hb .t i{transition:transform 1.2s var(--ease);transition-delay:var(--d,0s);transform:scaleX(1)}
.words{display:flex;flex-wrap:wrap;gap:1.6cqw 3cqw;align-items:baseline}
.words span{font-weight:800;letter-spacing:-.03em;line-height:1}
.pm{display:flex;gap:4cqw;align-items:baseline;flex-wrap:wrap}
.pm .big:last-child{opacity:.55}
.weeks{display:flex;gap:1.4cqw;align-items:flex-end;height:22cqw}
.weeks div{flex:1;display:flex;flex-direction:column;align-items:center;gap:1.4cqw;height:100%;justify-content:flex-end}
.weeks i{display:block;width:100%;border-radius:1.4cqw;background:var(--ac);height:var(--h);transform:scaleY(0);transform-origin:bottom}
.on .weeks i{transition:transform 1s var(--ease);transition-delay:calc(.3s + var(--i) * 60ms);transform:scaleY(1)}
.weeks span{font:600 2.8cqw var(--mono);opacity:.7}
.ico{display:block;width:32cqw;height:32cqw;overflow:visible}
.ico.sm{display:inline-block;width:5.2cqw;height:5.2cqw;vertical-align:-.9cqw;margin-right:1cqw}
.hint{font:500 3cqw/1.4 var(--mono);opacity:.6}

.summary{gap:2.4cqw;padding-top:17cqw}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
.grid div{border:1px solid color-mix(in srgb,var(--fg) 18%,transparent);border-radius:3cqw;padding:3.2cqw}
.grid b{display:block;font-weight:800;font-size:min(8.4cqw,var(--fs,8.4cqw));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.04em;color:var(--ac);line-height:1}
.grid span{font:600 2.9cqw/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.acts{display:flex;gap:2.4cqw;position:relative;z-index:30}
.btn{all:unset;cursor:pointer;flex:1;text-align:center;padding:3.6cqw;border-radius:99px;font-weight:800;font-size:4cqw;background:var(--ac);color:var(--bg)}
.btn.g{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--fg) 35%,transparent)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.tap{position:absolute;inset:0;z-index:10;display:grid;grid-template-columns:30% 70%}
.tap i{cursor:pointer}
.mv{position:fixed;inset:0;z-index:100;display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;padding:16px;
  background:rgba(14,14,17,.94);--ac:var(--lime);--bg:var(--ink);--fg:var(--paper);color:var(--paper);overflow:auto}
.mv[hidden]{display:none}
.mv canvas{height:min(74dvh,760px);width:auto;aspect-ratio:9/16;border-radius:18px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 90px rgba(0,0,0,.6);background:var(--ink)}
.mv-side{width:min(320px,100%);display:grid;gap:14px}
.mv-side b{font-weight:800;font-size:26px;letter-spacing:-.02em}
.mv-side p{font:500 13px/1.5 var(--mono);opacity:.7;min-height:1.5em}
.mv-bar{height:4px;border-radius:2px;background:rgba(244,240,230,.15);overflow:hidden}
.mv-bar i{display:block;height:100%;background:var(--lime);transform:scaleX(0);transform-origin:left}
.mv-acts{display:grid;gap:10px}
.mv .btn{font-size:16px;padding:15px 18px}
@media (max-width:699px){.mv{flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;gap:16px}.mv canvas{height:58dvh}.mv-side{width:100%}}
.foot{position:absolute;bottom:4cqw;left:7cqw;right:7cqw;font:500 2.8cqw var(--mono);opacity:.5;z-index:20;color:var(--fg)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important;transition-delay:0s!important}}
</style>
